[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h1b-job-insights"
version = "0.1.0"
description = "Historical H-1B LCA evidence for job seekers"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
data = [
    "openpyxl>=3.1",
    "pyarrow>=18",
]
analysis = [
    "pyarrow>=18",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
ml = [
    "numpy>=1.26",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "joblib>=1.4",
]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
